# Nostr gateway for KubeOpenCode agents — one central deployment.
#
# Plan: plan.md §3-§5. The gateway is a separate Deployment because the
# KubeOpenCode Agent CRD has no documented sidecar field (plan option B), and
# one gateway can serve every agent in the namespace.
#
#   kubectl apply -f deploy/k8s.yaml
#
# The OpenCode servers (:4096) are never exposed outside the cluster; only the
# gateway's :8080 has a Service, and only for the plain-HTTP API.
#
# Two replicas, one of which does the relay work. Every replica serves the HTTP
# API — a chat completion is answered inside its own request — but only the one
# holding the `nostr-gateway` Lease subscribes to the relays, because an agent
# key is one identity and two subscribers prompt OpenCode twice per message. See
# README "Running more than one replica".
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubeopencode
---
# Agent identities. Nostr private keys live here and are injected as env vars;
# they never appear in the Agent CRD, the ConfigMap or an image.
apiVersion: v1
kind: Secret
metadata:
  name: nostr-identities
  namespace: kubeopencode
type: Opaque
stringData:
  FRONTEND_NSEC: "nsec1replace-me-with-a-real-agent-key"
  GATEWAY_TOKEN: "replace-me"
---
# The gateway's view of the cluster: agent name -> OpenCode service + Nostr key.
# `allow` is a list of hex pubkeys; empty means anyone may talk to the agent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: kubeopencode
data:
  agents.json: |
    {
      "frontend-agent": {
        "opencode": "http://frontend-agent.kubeopencode.svc.cluster.local:4096",
        "npub": "npub1replace-me",
        "nsec_env": "FRONTEND_NSEC",
        "allow": [],
        "model": "anthropic/claude-sonnet-4-5",
        "opencode_agent": "build"
      }
    }
  # Every relay the gateway talks to, and it fills both roles on all of them:
  # the encrypted kind-30078 envelopes in and out, plus the Buzz channels, the
  # agent profile and presence. A relay that serves no NIP-29 answers the channel
  # discovery with nothing, which is one `warn` line and a `debug` line per
  # refresh, so a plain public relay in this list is fine.
  #
  # The split that matters is per connection, not per relay: each agent opens one
  # pool for the encrypted listener and another for the channel events, so their
  # NIP-42 handshakes cannot collide on one websocket.
  relays: "wss://nos.lol,wss://relay.damus.io"
---
# The only Kubernetes access the gateway has: one Lease, to tell replicas apart.
# get and update are the renewals, create is the first claim. There is no watch
# and no list — it polls its own claim every 5s against a 15s duration, which is
# a few requests an hour per pod.
#
# `create` is the one verb resourceNames cannot narrow, because Kubernetes has
# nothing to match a name against on a create, so this Role may create any Lease in
# this namespace. The gateway only ever creates its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nostr-gateway
  namespace: kubeopencode
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nostr-gateway
  namespace: kubeopencode
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nostr-gateway
  namespace: kubeopencode
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nostr-gateway
subjects:
  - kind: ServiceAccount
    name: nostr-gateway
    namespace: kubeopencode
---
# The agent itself. Fields follow plan.md §10; check them against the
# KubeOpenCode CRD version you actually run.
apiVersion: kubeopencode.dev/v1alpha1
kind: Agent
metadata:
  name: frontend-agent
  namespace: kubeopencode
spec:
  description: "Frontend agent reachable over Nostr"
  model: "anthropic/claude-sonnet-4-5"
  agent: "build"
  environment: |
    PROJECT_ID=frontend
  workspace:
    mountPath: /workspace
    git: "https://github.com/example/frontend.git"
---
# Cluster-internal handle on the agent's OpenCode server.
apiVersion: v1
kind: Service
metadata:
  name: frontend-agent
  namespace: kubeopencode
spec:
  selector:
    app: frontend-agent
  ports:
    - name: http
      port: 4096
      targetPort: 4096
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nostr-gateway
  namespace: kubeopencode
  labels:
    app: nostr-gateway
spec:
  replicas: 2
  # RollingUpdate, which at replicas: 2 starts the new pod before stopping the
  # old one. That overlap is exactly what used to be forbidden here: the two
  # processes hold the same nsec, authenticate as the same pubkey, and both carry
  # a REQ for the same `p` tag, so every inbound message became two prompts in two
  # OpenCode sessions with the answer on the wire twice. The Lease is what makes
  # the overlap safe now — one of the two holds it and subscribes, the other waits
  # — so maxUnavailable stays 0 and a rollout never takes the relay side down.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nostr-gateway
  template:
    metadata:
      labels:
        app: nostr-gateway
    spec:
      serviceAccountName: nostr-gateway
      # A restart of the pod holding the lease is a handover, so the grace period
      # is longer than the 5s it needs to hand the Lease back: the next pod waits
      # out the rest of the lease duration otherwise.
      terminationGracePeriodSeconds: 20
      # One gateway on one node is the outage this is meant to remove, so ask for
      # a different node first. Preferred, not required: a single-node cluster
      # still gets two replicas, just on the same node.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: nostr-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/example/nostr-gateway:latest
          args: []
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: AGENTS_FILE
              value: /etc/gateway/agents.json
            - name: RELAYS
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: relays
            - name: GATEWAY_ADDR
              value: ":8080"
            # Who does the relay work. The replica that wins this Lease
            # subscribes to the relays and publishes answers, the other one serves
            # the HTTP API and stands by; the winner is in the log as
            # "relay lease held: this replica subscribes to the relays". A pod
            # that cannot read the service account token exits instead of serving
            # an API and subscribing to nothing, which would be two deaf pods and
            # no log that says why.
            - name: LEASE_NAME
              value: "nostr-gateway"
            # The claim is per pod, not per Deployment: two pods on one lease name
            # is the race the Lease resolves, and POD_NAME is what tells them
            # apart. POD_NAMESPACE is the namespace the Lease lives in.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Debug, not the default info, because the lines that tell a dead
            # subscription apart from a dropped message are all Debug:
            # "buzz: inbound channel message" is the only proof on the success
            # path that anything arrived, and "inbound message not for this agent"
            # is the only proof that something arrived and was then refused. At
            # info, "the relay never delivered it" and "the gateway got it and
            # threw it away" are the same empty log — which is what made this
            # deafness expensive to find rather than obvious.
            # Narrow enough to keep: the listeners subscribe to kind 30078 and
            # kind 9 only. Drop back to info once the fault is found.
            - name: LOG_LEVEL
              value: "debug"
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nostr-identities
                  key: GATEWAY_TOKEN
            - name: FRONTEND_NSEC
              valueFrom:
                secretKeyRef:
                  name: nostr-identities
                  key: FRONTEND_NSEC
          ports:
            - name: http
              containerPort: 8080
          # /healthz answers 200 unconditionally, so neither probe can see that
          # the gateway has lost its relay subscriptions — a deaf pod stays in the
          # Service and is never replaced. What these probes *can* do is the
          # opposite harm, so they are tuned against it: a restart is this
          # gateway's deafness, because conversations live in memory and the
          # subscription only looks 5 seconds back. That is now a handover rather
          # than an outage for the pod holding the Lease, and nothing at all for
          # the one standing by, but a probe cannot tell the two apart — /healthz
          # is deliberately not a readiness signal for the relay side.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # 1s / 10s / 3 are the defaults and they are wrong for this process:
            # a 32 MB per-SSE-line read (maxEventBytes, and README records that
            # the line is read before it is measured) inside a memory limit and
            # under a 500m CFS cap is enough to miss a one-second deadline three
            # times inside thirty seconds, and the kubelet's answer to that is
            # SIGTERM. Ten seconds of slack and five failures means ~150s of real
            # unresponsiveness before a merely busy process is killed.
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              # 256Mi is under the gateway's own documented worst case:
              # maxEventBytes is 32 MB per SSE line and README records that the
              # line is read before it is measured, so 32 MB is a floor on one
              # allocation rather than a bound on it. An OOMKill is SIGKILL —
              # nothing is logged, the pod comes back and re-subscribes with five
              # seconds of lookback, which reads as "it answered once and then went
              # deaf" with a clean log.
              # ponytail: a limit sized above the known allocation, not a fix for
              # it; truncate tool output upstream if this ever has to be tight.
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: nostr-gateway
  namespace: kubeopencode
spec:
  selector:
    app: nostr-gateway
  # ClientIP, so a client that POSTs a message and then follows the SSE stream of
  # that conversation lands on the pod that has it in memory. Without it the two
  # requests can hit different replicas and the stream starts empty — the
  # conversation map is per process and is not shared. /v1/chat/completions needs
  # none of this: it is one request that carries its own answer back.
  sessionAffinity: ClientIP
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Keep one gateway up through a node drain or a voluntary disruption. Only the
# lease holder's absence is a real outage, and minAvailable 1 is what keeps a second
# pod in the rollout.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nostr-gateway
  namespace: kubeopencode
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nostr-gateway
